name: Contribution snake
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23315eff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%238fa8ff
      - name: Publish only generated images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -b snake-output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          git commit -m 'Refresh contribution snake artwork'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:snake-output
